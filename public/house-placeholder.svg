    <rect x="260" y="430" width="170" height="160" rx="16" fill="#f1f7ff" stroke="#cfe1ff" stroke-width="8"/>
    <rect x="530" y="430" width="170" height="160" rx="16" fill="#f1f7ff" stroke="#cfe1ff" stroke-width="8"/>

    <rect x="420" y="520" width="160" height="170" rx="18" fill="#0b4d8a" opacity="0.92"/>
    <circle cx="560" cy="605" r="10" fill="#ffffff" opacity="0.9"/>
